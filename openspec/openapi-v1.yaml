      operationId: sendChatMessage
      x-astrbot-scope: chat
      x-astrbot-sensitive-scopes: ["chat:admin"]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatRequest"
      responses:
        "200":
          $ref: "#/components/responses/Ok"

  /api/v1/chat/ws:
    get:
      tags: [Chat]
      summary: Open a streaming chat WebSocket
      operationId: openChatWebSocket
      x-websocket: true
      x-astrbot-scope: chat
      x-astrbot-sensitive-scopes: ["chat:admin"]
      parameters:
        - name: api_key
          in: query
          schema:
            type: string
        - name: key
          in: query
          schema:
            type: string
      responses:
        "101":
          description: WebSocket upgrade accepted

  /api/v1/live-chat/ws:
    get:
      tags: [Chat]
      summary: Open the live voice chat WebSocket
      description: >-
        Dashboard JWTs resolve to the current enabled account and are revalidated
        for every received message. Bind with t=bind, session_id and optional
        config_id, selected_provider, selected_model and thinking_effort before
        recording in an existing owned WebChat conversation. Live attachments
        arrive as t=attachment with ordinary attachment metadata; content requires
        the owning account. Audio chunks, STT text and original recordings retain
        their existing behavior. Closing the connection detaches its output socket
        without forcibly stopping the core run; the existing turn consumer keeps
        persisting output and exposing owned recovery until the core end event. Legacy
        /api/live_chat/ws uses the same rules.
      operationId: openLiveChatWebSocket
      x-websocket: true
      x-astrbot-scope: chat
      parameters:
        - name: token
          in: query
          required: true
          schema:
            type: string
      responses:
        "101":
          description: WebSocket upgrade accepted

  /api/v1/unified-chat/ws:
    get:
      tags: [Chat]
      summary: Open the unified live/chat WebSocket
      description: >-
        Uses the same current Dashboard-account identity and ownership checks as
        HTTP Chat and live voice. ct=chat accepts public message parts containing
        owned attachment_id and reply/message_id/selected_text references from
        the target conversation, plus config_id, selected_provider,
        selected_model and thinking_effort. ct=live uses the live bind and audio
        messages. Internal execution flags and shared configuration edits are not
        accepted from ordinary accounts. Legacy /api/unified_chat/ws follows the
        same contract. Independent API-key /api/v1/chat/ws retains its own flow.
      operationId: openUnifiedChatWebSocket
      x-websocket: true
      x-astrbot-scope: chat
      parameters:
        - name: token
          in: query
          required: true
          schema:
            type: string
      responses:
        "101":
          description: WebSocket upgrade accepted

