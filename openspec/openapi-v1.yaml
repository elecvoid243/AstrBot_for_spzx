        travels in the path so relative URLs inherit it through normal path
        resolution. Use an empty asset_path (trailing slash) for the entry
        document.
      operationId: getPluginViewTokenAsset
      parameters:
        - $ref: "#/components/parameters/PluginId"
        - name: view_name
          in: path
          required: true
          schema:
            type: string
        - name: token
          in: path
          required: true
          description: Scoped plugin page asset token.
          schema:
            type: string
        - name: asset_path
          in: path
          required: true
          description: URL-encoded relative asset path.
          schema:
            type: string
      responses:
        "200":
          description: Plugin asset content
        "401":
          description: Missing, invalid, expired, or wrongly scoped token

