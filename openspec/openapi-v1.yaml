      tags: [Chat]
      summary: Replace the authenticated account's click-to-send phrase list
      description: |
        Stores a private list for the authenticated account, including administrators.
        Other accounts and the legacy instance defaults remain unchanged.
        An empty list is persisted and does not revert to the defaults.
