          minItems: 1
          title: Allowed Roles
          type: array
        required_inputs:
          items:
            type: string
          maxItems: 30
          title: Required Inputs
          type: array
        max_members:
          default: 8
          maximum: 100
          minimum: 2
          title: Max Members
          type: integer
        max_parallel:
          default: 4
          maximum: 100
          minimum: 1
          title: Max Parallel
          type: integer
        max_tasks:
          default: 50
          maximum: 100
          minimum: 1
          title: Max Tasks
          type: integer
        max_depth:
          default: 3
          maximum: 20
          minimum: 1
          title: Max Depth
          type: integer
        limits:
