openapi: 3.1.0
info:
  title: AstrBot OpenAPI v1
  version: 0.1.0
  description: >
    Target REST contract for migrating AstrBot HTTP APIs to /api/v1.
    Dynamic AstrBot configuration payloads are intentionally modeled as open
    JSON objects because their schemas are provided at runtime by template
    endpoints.
    Developer API keys currently support these scopes only: bot, provider,
    persona, im, config, chat, data, file, plugin, mcp, skill, plus the sensitive
    config:edit_admin and chat:admin sub-scopes. The config scope also grants bot
    and provider access, but no parent scope grants a sensitive sub-scope.
x-astrbot-scope-definitions:
  bot:
    description: Manage bot and platform configurations.
    description_zh: 管理机器人及平台配置。
  provider:
    description: Manage model providers and provider sources.
    description_zh: 管理模型服务提供商和提供商源。
  persona:
    description: Manage personas and persona folders.
    description_zh: 管理人格设定和人格文件夹。
  im:
    description: Send proactive IM messages and query bot or platform identifiers.
    description_zh: 主动发送 IM 消息，并查询机器人或平台标识。
  config:
    description: Manage configuration profiles, system configuration, and shared configuration, excluding changes to `admins_id`.
    description_zh: 管理配置文件、系统配置和通用配置，但不包含修改 `admins_id` 的能力。
    includes: [bot, provider]
  "config:edit_admin":
    description: Allow a `config`-scoped key to change `admins_id`. This sub-scope must be granted explicitly.
    description_zh: 允许具有 `config` 权限的 Key 修改 `admins_id`。该子权限必须显式授予。
    parent: config
    sensitive: true
  chat:
    description: Use chat capabilities and manage ChatUI sessions and projects.
    description_zh: 调用对话能力，并管理 ChatUI 会话和项目。
  "chat:admin":
    description: Allow `username` to use a configured AstrBot administrator ID. This sub-scope must be granted explicitly.
    description_zh: 允许 `username` 使用 AstrBot 中已配置的管理员 ID。该子权限必须显式授予。
    parent: chat
    sensitive: true
  data:
    description: Manage conversations and platform-session data.
    description_zh: 管理对话记录和平台会话数据。
  file:
    description: Upload and download chat attachments.
    description_zh: 上传和下载对话附件。
  plugin:
    description: Manage plugins, plugin configuration, plugin sources, and marketplace data.
    description_zh: 管理插件、插件配置、插件源和插件市场数据。
  mcp:
    description: Manage MCP server configuration and provider synchronization.
    description_zh: 管理 MCP 服务器配置和服务端同步。
  skill:
    description: Manage Skills, archives, files, and Shipyard Neo Skill workflows.
    description_zh: 管理 Skills、Skill 压缩包、Skill 文件和 Shipyard Neo Skill 流程。
servers:
  - url: http://localhost:6185
    description: Local AstrBot server

security:
  - ApiKeyAuth: []

tags:
  - name: Open API
  - name: Accounts
  - name: Auth
  - name: API Keys
  - name: System Config
  - name: Config Profiles
  - name: Bot Config Routes
  - name: Bots
  - name: Provider Sources
  - name: Providers
  - name: Chat
  - name: IM
  - name: Files
  - name: Plugins
  - name: Plugin Sources
  - name: Plugin Views
  - name: Commands
  - name: Tools
  - name: MCP
  - name: Skills
  - name: Knowledge Base
  - name: Personas
  - name: Sessions
  - name: Conversations
  - name: Stats
  - name: Backups
  - name: Updates
  - name: Cron
  - name: Logs
  - name: T2I
  - name: Subagents
  - name: Webhooks

paths:
  /api/v1/plugins/browser-control/session:
    post:
      tags: [Plugins]
      operationId: createBrowserControlSession
      summary: Issue a single-use browser control ticket
      description: >
        Requires a Dashboard login and an owned main ChatUI session. Tickets expire
        after 15 seconds and are submitted as {ticket} in the first message to
        /api/v1/plugins/browser-control/ws, never in a URL. The authenticated socket
        acquires browser control before enabling typed BrowserControlCommand input. See the manual control
        protocol in docs/en/dev/browser-manual-control.md for input acknowledgements.
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BrowserControlSessionRequest'
      responses:
        '200':
          description: Expiring connection-bound ticket
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrowserControlSessionResponse'
        '403':
          description: Chat ownership or plugin capability denied
        '409':
          description: Browser identity expired or plugin update required
  /api/v1/auth/session:
    get:
      tags: [Accounts]
      summary: Read the current enabled Dashboard account
      operationId: currentAccount
      security: [{ BearerAuth: [] }]
      responses:
        "200":
          description: Trusted account identity
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AccountResponse" }
        "401": { $ref: "#/components/responses/Error" }
  /api/v1/accounts:
    get:
      tags: [Accounts]
      summary: List ordinary accounts as a Dashboard administrator
      operationId: listAccounts
      security: [{ BearerAuth: [] }]
      responses:
        "200":
          description: Ordinary accounts without credentials
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AccountListResponse" }
        "403": { $ref: "#/components/responses/Error" }
    post:
      tags: [Accounts]
      summary: Create an ordinary account with initial credentials
      operationId: createAccount
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AccountCreateRequest" }
      responses:
        "200":
          description: Created ordinary account
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AccountResponse" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /api/v1/accounts/{account_id}/reset-password:
    post:
      tags: [Accounts]
      summary: Reset an ordinary account password and revoke existing sessions
      operationId: resetAccountPassword
      security: [{ BearerAuth: [] }]
      parameters:
        - in: path
          name: account_id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AccountPasswordResetRequest" }
      responses:
        "200":
          description: Updated ordinary account without credentials
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AccountResponse" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /api/v1/accounts/{account_id}/disable:
    post:
      tags: [Accounts]
      summary: Disable an ordinary account and revoke existing sessions
      operationId: disableAccount
      security: [{ BearerAuth: [] }]
      parameters:
        - in: path
          name: account_id
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Disabled ordinary account without credentials
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AccountResponse" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /api/v1/accounts/{account_id}/enable:
    post:
      tags: [Accounts]
      summary: Re-enable an ordinary account without restoring old login sessions
      operationId: enableAccount
      security: [{ BearerAuth: [] }]
      parameters:
        - in: path
          name: account_id
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Enabled ordinary account without credentials
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AccountResponse" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /api/v1/accounts/{account_id}:
    delete:
      tags: [Accounts]
      summary: Permanently delete an ordinary account and its owned Chat data
      description: |
        Administrator-only. Revokes access and cleans owned chats, attachments,
        projects and account preferences before removing the account.
        External host directories are not deleted. A failed cleanup leaves the
        account disabled so the administrator can retry.
      operationId: deleteAccount
      security: [{ BearerAuth: [] }]
      parameters:
        - in: path
          name: account_id
          required: true
          schema: { type: string }
      responses:
        "200": { $ref: "#/components/responses/Ok" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
  /api/v1/system/announcement:
    get:
      tags: [Updates]
      summary: Read the shared announcement as an authenticated Dashboard account
      description: |
        Available to administrator and ordinary Dashboard accounts. Existing
        system API keys retain access. This grants no system management access.
        The compatibility URL is GET /api/system/announcement.
      operationId: getSystemAnnouncement
      x-astrbot-scope: system
      responses:
        "200": { $ref: "#/components/responses/Ok" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "502": { $ref: "#/components/responses/Error" }
  /api/v1/auth/login:
    post:
      tags: [Auth]
      summary: Login to the dashboard API
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Authenticated persisted dashboard account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSessionResponse"
        "401":
          $ref: "#/components/responses/Error"

  /api/v1/auth/logout:
    post:
      tags: [Auth]
      summary: Logout from the dashboard API
      operationId: logout
      responses:
        "200":
          $ref: "#/components/responses/Ok"

  /api/v1/auth/setup-status:
    get:
      tags: [Auth]
      summary: Get first-run setup status
      operationId: getAuthSetupStatus
      security: []
      responses:
        "200":
          $ref: "#/components/responses/Ok"

  /api/v1/auth/setup:
    post:
      tags: [Auth]
      summary: Complete first-run dashboard account setup
      operationId: setupAuth
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetupAuthRequest"
      responses:
        "200":
          description: Authenticated persisted dashboard account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSessionResponse"

  /api/v1/auth/totp/setup:
    post:
      tags: [Auth]
      summary: Start or refresh TOTP setup
      operationId: setupTotp
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TotpSetupRequest"
      responses:
        "200":
          $ref: "#/components/responses/Ok"

  /api/v1/auth/totp/recovery:
    post:
      tags: [Auth]
      summary: Generate or rotate TOTP recovery codes
      operationId: recoverTotp
      responses:
        "200":
          $ref: "#/components/responses/Ok"

  /api/v1/auth/account:
    patch:
      tags: [Auth]
      summary: Update dashboard account credentials
      operationId: updateAuthAccount
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateAccountRequest"
      responses:
        "200":
          $ref: "#/components/responses/Ok"

  /api/v1/api-keys:
    get:
      tags: [API Keys]
      summary: List OpenAPI keys
      operationId: listApiKeys
      responses:
        "200":
          $ref: "#/components/responses/Ok"
    post:
      tags: [API Keys]
      summary: Create an OpenAPI key
      operationId: createApiKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateApiKeyRequest"
      responses:
        "200":
          $ref: "#/components/responses/Ok"

  /api/v1/api-keys/{key_id}/revoke:
    post:
      tags: [API Keys]
      summary: Revoke an OpenAPI key
      operationId: revokeApiKey
      parameters:
        - $ref: "#/components/parameters/KeyId"
      responses:
        "200":
          $ref: "#/components/responses/Ok"

  /api/v1/api-keys/{key_id}:
    delete:
      tags: [API Keys]
      summary: Delete an OpenAPI key
      operationId: deleteApiKey
      parameters:
        - $ref: "#/components/parameters/KeyId"
      responses:
        "200":
          $ref: "#/components/responses/Ok"

  /api/v1/system-config/schema:
    get:
      tags: [System Config]
      summary: Get the system configuration schema
      operationId: getSystemConfigSchema
      x-astrbot-scope: config
      responses:
        "200":
          $ref: "#/components/responses/Ok"

  /api/v1/system-config:
    get:
      tags: [System Config]
      summary: Get the system configuration
      operationId: getSystemConfig
      x-astrbot-scope: config
      responses:
        "200":
          $ref: "#/components/responses/Ok"
    put:
      tags: [System Config]
      summary: Replace the system configuration
      operationId: updateSystemConfig
      x-astrbot-scope: config
      x-astrbot-sensitive-scopes: ["config:edit_admin"]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DynamicConfig"
      responses:
        "200":
          $ref: "#/components/responses/Ok"

  /api/v1/system-config/runtime:
    get:
      tags: [System Config]
      summary: Get runtime-enriched system configuration metadata
      operationId: getSystemConfigRuntime
      x-astrbot-scope: config
      responses:
        "200":
          $ref: "#/components/responses/Ok"

  /api/v1/config-profiles/schema:
    get:
      tags: [Config Profiles]
      summary: Get the configuration profile schema
      operationId: getConfigProfileSchema
      x-astrbot-scope: config
      responses:
        "200":
          $ref: "#/components/responses/Ok"

  /api/v1/config-profiles:
    get:
      tags: [Config Profiles]
      summary: List configuration profiles
      operationId: listConfigProfiles
      x-astrbot-scope: config
      responses:
        "200":
          $ref: "#/components/responses/Ok"
    post:
      tags: [Config Profiles]
      summary: Create a configuration profile
      operationId: createConfigProfile
      x-astrbot-scope: config
      x-astrbot-sensitive-scopes: ["config:edit_admin"]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateConfigProfileRequest"
      responses:
        "200":
          $ref: "#/components/responses/Ok"

  /api/v1/config-profiles/{config_id}:
    get:
      tags: [Config Profiles]
      summary: Get a configuration profile
      operationId: getConfigProfile
      x-astrbot-scope: config
      parameters:
        - $ref: "#/components/parameters/ConfigId"
      responses:
        "200":
          $ref: "#/components/responses/Ok"
    put:
      tags: [Config Profiles]
      summary: Replace a configuration profile
      operationId: updateConfigProfileContent
      x-astrbot-scope: config
      x-astrbot-sensitive-scopes: ["config:edit_admin"]
      parameters:
        - $ref: "#/components/parameters/ConfigId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DynamicConfig"
      responses:
        "200":
          $ref: "#/components/responses/Ok"
    patch:
      tags: [Config Profiles]
      summary: Rename a configuration profile
      operationId: renameConfigProfile
      x-astrbot-scope: config
      parameters:
        - $ref: "#/components/parameters/ConfigId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RenameRequest"
      responses:
        "200":
          $ref: "#/components/responses/Ok"
    delete:
      tags: [Config Profiles]
      summary: Delete a configuration profile
      operationId: deleteConfigProfile
      x-astrbot-scope: config
      parameters:
        - $ref: "#/components/parameters/ConfigId"
      responses:
        "200":
          $ref: "#/components/responses/Ok"

  /api/v1/config-routes:
    get:
      tags: [Bot Config Routes]
      summary: List UMO to configuration profile bindings
      operationId: listConfigRoutes
      x-astrbot-scope: config
      responses:
        "200":
          $ref: "#/components/responses/Ok"
    put:
      tags: [Bot Config Routes]
      summary: Replace all UMO to configuration profile bindings
      operationId: replaceConfigRoutes
      x-astrbot-scope: config
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConfigRoutesReplaceRequest"
      responses:
        "200":
          $ref: "#/components/responses/Ok"

  /api/v1/config-routes/{umo}:
    put:
      tags: [Bot Config Routes]
      summary: Bind a UMO to a configuration profile
      operationId: upsertConfigRoute
      x-astrbot-scope: config
      parameters:
        - $ref: "#/components/parameters/Umo"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConfigRouteUpsertRequest"
      responses:
        "200":
          $ref: "#/components/responses/Ok"
    delete:
      tags: [Bot Config Routes]
      summary: Remove a UMO configuration profile binding
      operationId: deleteConfigRoute
      x-astrbot-scope: config
      parameters:
        - $ref: "#/components/parameters/Umo"
      responses:
        "200":
          $ref: "#/components/responses/Ok"

  /api/v1/bot-types:
    get:
      tags: [Bots]
      summary: List configurable bot types and their schemas
      operationId: listBotTypes
      x-astrbot-scope: bot
      responses:
        "200":
          $ref: "#/components/responses/Ok"

  /api/v1/bot-types/{bot_type}/registration:
    post:
      tags: [Bots]
      summary: Run a bot type registration flow action
      operationId: registerBotType
      x-astrbot-scope: config
      parameters:
        - name: bot_type
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BotRegistrationRequest"
      responses:
        "200":
          $ref: "#/components/responses/Ok"

  /api/v1/bots:
    get:
      tags: [Bots]
      summary: List created bots and their configurations
      operationId: listBots
      x-astrbot-scope: bot
      parameters:
        - name: enabled
          in: query
          schema:
            type: boolean
        - name: type
          in: query
          schema:
            type: string
      responses:
        "200":
          $ref: "#/components/responses/Ok"
    post:
      tags: [Bots]
      summary: Create a bot from configuration
      operationId: createBot
      x-astrbot-scope: bot
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BotConfigRequest"
      responses:
        "200":
          $ref: "#/components/responses/Ok"

  /api/v1/bots/stats:
    get:
      tags: [Bots]
      summary: List runtime status for all bots
      operationId: listBotStats
      x-astrbot-scope: bot
      responses:
        "200":
          $ref: "#/components/responses/Ok"

  /api/v1/bots/by-id:
    get:
      tags: [Bots]
      summary: Get a bot configuration by query ID
      operationId: getBotById
      x-astrbot-scope: bot
      parameters:
        - name: bot_id
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          $ref: "#/components/responses/Ok"
    put:
      tags: [Bots]
      summary: Replace a bot configuration by body ID
      operationId: updateBotById
      x-astrbot-scope: bot
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [bot_id, config]
              properties:
                bot_id:
                  type: string
                config:
                  $ref: "#/components/schemas/DynamicConfig"
              additionalProperties: false
      responses:
        "200":
          $ref: "#/components/responses/Ok"
    delete:
      tags: [Bots]
      summary: Delete a bot by query ID
      operationId: deleteBotById
      x-astrbot-scope: bot
      parameters:
        - name: bot_id
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          $ref: "#/components/responses/Ok"

  /api/v1/bots/enabled:
    patch:
      tags: [Bots]
      summary: Enable or disable a bot by body ID
      operationId: setBotEnabledById
      x-astrbot-scope: bot
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [bot_id, enabled]
              properties:
                bot_id:
                  type: string
                enabled:
                  type: boolean
              additionalProperties: false
      responses:
        "200":
          $ref: "#/components/responses/Ok"

  /api/v1/bots/test:
    post:
      tags: [Bots]
      summary: Test a bot registration or connection by body ID
      operationId: testBotById
      x-astrbot-scope: bot
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [bot_id]
              properties:
                bot_id:
                  type: string
              additionalProperties: false
      responses:
        "200":
          $ref: "#/components/responses/Ok"

  /api/v1/bots/{bot_id}:
    get:
      tags: [Bots]
      summary: Get a bot configuration
      operationId: getBot
      x-astrbot-scope: bot
      parameters:
        - $ref: "#/components/parameters/BotId"
      responses:
        "200":
          $ref: "#/components/responses/Ok"
    put:
      tags: [Bots]
      summary: Replace a bot configuration
      operationId: updateBot
      x-astrbot-scope: bot
      parameters:
        - $ref: "#/components/parameters/BotId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BotConfigRequest"
      responses:
        "200":
          $ref: "#/components/responses/Ok"
    delete:
      tags: [Bots]
      summary: Delete a bot
      operationId: deleteBot
      x-astrbot-scope: bot
      parameters:
        - $ref: "#/components/parameters/BotId"
      responses:
        "200":
          $ref: "#/components/responses/Ok"

  /api/v1/bots/{bot_id}/enabled:
    patch:
      tags: [Bots]
      summary: Enable or disable a bot
      operationId: setBotEnabled
      x-astrbot-scope: bot
      parameters:
        - $ref: "#/components/parameters/BotId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EnabledPatch"
      responses:
        "200":
          $ref: "#/components/responses/Ok"

  /api/v1/bots/{bot_id}/test:
    post:
      tags: [Bots]
      summary: Test a bot registration or connection
      operationId: testBot
      x-astrbot-scope: bot
      parameters:
        - $ref: "#/components/parameters/BotId"
      responses:
        "200":
          $ref: "#/components/responses/Ok"

  /api/v1/providers/schema:
    get:
      tags: [Providers]
      summary: Get the overall provider configuration schema
      operationId: getProviderSchema
      x-astrbot-scope: provider
      responses:
        "200":
          $ref: "#/components/responses/Ok"

  /api/v1/provider-sources:
    get:
