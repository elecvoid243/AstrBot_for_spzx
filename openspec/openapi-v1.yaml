    post:
      tags: [Chat]
      summary: Upload a ChatUI session package and pre-check it
      operationId: importChatSessions
      description: Stages a format-version-1 archive for the authenticated resource owner only. Preview identifiers are not transferable and expire after 30 minutes or a service restart.
      x-astrbot-scope: chat
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/ChatSessionImportRequest"
      responses:
        "200":
          $ref: "#/components/responses/Ok"

  /api/v1/chat/sessions/import/confirm:
    post:
      tags: [Chat]
      summary: Confirm a staged ChatUI session import
      operationId: confirmImportChatSessions
      description: Consumes the uploader's preview once and creates new owned resource identifiers. Imported history is display data, never server file authority. Global routes, project membership, filesystem grants and remote agent identities are not restored.
      x-astrbot-scope: chat
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatSessionImportConfirmRequest"
      responses:
        "200":
          $ref: "#/components/responses/Ok"

