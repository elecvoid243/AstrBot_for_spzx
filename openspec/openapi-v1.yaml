      tags: [Chat]
      summary: Delete multiple webchat sessions
      operationId: batchDeleteChatSessions
      description: >-
        Operates only on sessions owned by the authenticated account, including
        administrators. Mixed batches report per-item failures without changing
        foreign sessions; inspect failed_items before updating local state.
      x-astrbot-scope: chat
      requestBody:
        required: true
        content:
          application/json:
            schema:
