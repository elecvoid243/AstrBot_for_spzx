      summary: Bind an administrator profile to an owned WebChat session or thread
      operationId: updateChatSessionConfig
      x-astrbot-scope: chat
      parameters:
        - in: path
          name: session_id
          required: true
          schema:
            type: string
      requestBody:
        required: true
