            schema:
              $ref: "#/components/schemas/ChatSessionConfigRequest"
      responses:
        "200":
          $ref: "#/components/responses/Ok"

  /api/v1/chat/ui-settings:
    get:
      tags: [Chat]
      summary: Get the ChatUI thinking-effort presets and the caller's edit permission
      description: |
        Returns the presets persisted under `chatui.thinking_effort` in
        `cmd_config.json` plus `can_edit`, which tells the frontend whether the
        caller may rewrite the preset list (it requires the `config` scope).
        The value is the caller's saved selection, falling back to the
        administrator's default. It never exposes another account's selection.
        Quick messages are private to the authenticated account; the existing
        instance list supplies initial content until that account saves its own.
        All chat accounts may edit their own quick messages. `can_edit` applies
        only to the shared thinking-effort preset definitions.
      operationId: getChatUiSettings
      x-astrbot-scope: chat
      responses:
        "200":
          $ref: "#/components/responses/Ok"

  /api/v1/chat/ui-settings/value:
    put:
      tags: [Chat]
      summary: Store the selected thinking-effort value
      description: |
        Persists the current selection only for the authenticated account.
        Preset definitions and the instance default remain unchanged.
      operationId: updateChatUiEffortValue
      x-astrbot-scope: chat
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [value]
              properties:
                value:
                  type: string
                  description: Free-form effort value forwarded to the provider (e.g. `max`, `xhigh`, `72`).
                active_preset:
                  type: string
                  description: Optional existing preset ID selected only for this account.
              additionalProperties: false
      responses:
        "200":
          $ref: "#/components/responses/Ok"

  /api/v1/chat/ui-settings/presets:
    put:
      tags: [Chat]
      summary: Replace the thinking-effort preset list and active selection
      operationId: updateChatUiEffortPresets
      x-astrbot-scope: config
      x-astrbot-sensitive-scopes: [config:edit_admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatUiThinkingEffortPresetsRequest"
      responses:
        "200":
          $ref: "#/components/responses/Ok"

