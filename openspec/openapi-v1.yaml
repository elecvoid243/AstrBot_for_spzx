      operationId: exportChatSession
      description: Exports only the authenticated account's WebChat session and accessible packaged resources. Administrator chat access follows the same ownership rule. Returns an inline ZIP response with a filename for authenticated clients; ChatUI creates the download after receiving its bytes.
