        Ordinary accounts and administrators may access only their own WebChat
        sessions. History, markers and associated resources retain that ownership.
      x-astrbot-scope: chat
      parameters:
        - $ref: "#/components/parameters/SessionId"
        - name: before_id
          in: query
          required: false
          schema: { type: integer }
          description: Exclusive cursor; only records with a smaller id are returned.
        - name: limit
          in: query
          required: false
          schema: { type: integer, default: 50 }
          description: Page size.
      responses:
        "200":
          $ref: "#/components/responses/Ok"

