components:
  securitySchemes:
    ChatBrowserSession:
      type: apiKey
      description: Browser-only credential confirmed by the initiating sender in the original
        chat.
      in: header
      name: X-AstrBot-Chat-Session
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  responses:
    Ok:
      description: Standard AstrBot success response
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/SuccessEnvelope"
    Error:
      description: Standard AstrBot error response
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    Text:
      description: Text response
      content:
        text/plain:
          schema:
            type: string
        application/json:
          schema:
            $ref: "#/components/schemas/SuccessEnvelope"
    Html:
      description: HTML response
      content:
        text/html:
          schema:
            type: string

  parameters:
    AttachmentId:
      name: attachment_id
      in: path
      required: true
      schema:
        type: string
    AttachmentIdQuery:
      name: attachment_id
      in: query
      required: true
      schema:
        type: string
    BotId:
      name: bot_id
      in: path
      required: true
      schema:
        type: string
    ChunkId:
      name: chunk_id
      in: path
      required: true
      schema:
        type: string
    CommandId:
      name: command_id
      in: path
      required: true
      description: URL-encoded command handler full name.
      schema:
        type: string
    ConfigId:
      name: config_id
      in: path
      required: true
      schema:
        type: string
    ConversationId:
      name: conversation_id
      in: path
      required: true
      schema:
        type: string
    DocumentId:
      name: document_id
      in: path
      required: true
      schema:
        type: string
    FilePath:
      name: file_path
      in: path
      required: true
      description: URL-encoded relative file path.
      schema:
        type: string
    Filename:
      name: filename
      in: path
      required: true
      schema:
        type: string
    FolderId:
      name: folder_id
      in: path
      required: true
      schema:
        type: string
    GroupId:
      name: group_id
      in: path
      required: true
      schema:
        type: string
    KbId:
      name: kb_id
      in: path
      required: true
      schema:
        type: string
    KeyId:
      name: key_id
      in: path
      required: true
      schema:
        type: string
    Name:
      name: name
      in: path
      required: true
      schema:
        type: string
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: page_size
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 20
    PersonaId:
      name: persona_id
      in: path
      required: true
      schema:
        type: string
    PluginId:
      name: plugin_id
      in: path
      required: true
      schema:
        type: string
    ProviderId:
      name: provider_id
      in: path
      required: true
      schema:
        type: string
    SessionId:
      name: session_id
      in: path
      required: true
      schema:
        type: string
    ServerName:
      name: server_name
      in: path
      required: true
      schema:
        type: string
    SkillName:
      name: skill_name
      in: path
      required: true
      schema:
        type: string
    SourceId:
      name: source_id
      in: path
      required: true
      schema:
        type: string
    TaskId:
      name: task_id
      in: path
      required: true
      schema:
        type: string
    ToolId:
      name: tool_id
      in: path
      required: true
      schema:
        type: string
    Umo:
      name: umo
      in: path
      required: true
      description: URL-encoded unified message origin.
      schema:
        type: string
    WebhookUuid:
      name: webhook_uuid
      in: path
      required: true
      schema:
        type: string
    TeamIdPath:
      name: team_id
      in: path
      required: true
      schema: { type: string }
    MemberIdPath:
      name: member_id
      in: path
      required: true
      schema: { type: string }
    WorkflowIdPath:
      name: workflow_id
      in: path
      required: true
      schema: { type: string }
    RunIdPath:
      name: run_id
      in: path
      required: true
      schema: { type: string }
    NodeIdPath:
      name: node_id
      in: path
      required: true
      schema: { type: string }

  schemas:
    DraftRebaseRequest:
      properties:
        expected_revision:
          type: integer
          minimum: 1.0
          title: Expected Revision
        published_version:
          type: integer
          minimum: 1.0
          title: Published Version
      additionalProperties: false
      type: object
      required:
      - expected_revision
      - published_version
      title: DraftRebaseRequest
      description: Expected draft revision and explicitly reviewed latest version.
    DraftCreateRequest:
      properties:
        body:
          additionalProperties: true
          type: object
          title: Body
        asset_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Asset Id
      additionalProperties: false
      type: object
      required:
      - body
      title: DraftCreateRequest
      description: Initial editable snapshot and optional existing asset identity.
    DraftPublishRequest:
      properties:
        revision:
          type: integer
          minimum: 1.0
          title: Revision
      additionalProperties: false
      type: object
      required:
      - revision
      title: DraftPublishRequest
      description: Revision to publish as an immutable asset version.
    DraftUpdateRequest:
      properties:
        body:
          additionalProperties: true
          type: object
          title: Body
        expected_revision:
          type: integer
          minimum: 1.0
          title: Expected Revision
      additionalProperties: false
      type: object
      required:
      - body
      - expected_revision
      title: DraftUpdateRequest
      description: Snapshot update guarded by an expected revision.
    BrowserControlTarget:
      additionalProperties: false
      properties:
        tab_id:
          maxLength: 128
          minLength: 1
          title: Tab Id
          type: string
        document_id:
          maxLength: 128
          minLength: 1
          title: Document Id
          type: string
        viewport_width:
          exclusiveMinimum: 0
          maximum: 32768
          title: Viewport Width
          type: number
        viewport_height:
          exclusiveMinimum: 0
          maximum: 32768
          title: Viewport Height
          type: number
        scroll_x:
          title: Scroll X
          type: number
        scroll_y:
          title: Scroll Y
          type: number
        position_revision:
          anyOf:
          - minimum: 0
            type: integer
          - type: 'null'
          default: null
          title: Position Revision
      required:
      - tab_id
      - document_id
      - viewport_width
      - viewport_height
      - scroll_x
      - scroll_y
      title: BrowserControlTarget
      type: object
    BrowserControlCommand:
      additionalProperties: false
      description: Closed input vocabulary; browser targets can only be validated, not
        chosen.
      properties:
        operation:
          enum:
          - click
          - wheel
          - key
          - text
          - reset_keys
          - heartbeat
          - release
          - resize
          title: Operation
          type: string
        control_epoch:
          minimum: 1
          title: Control Epoch
          type: integer
        width:
          anyOf:
          - maximum: 2560
            minimum: 320
            type: integer
          - type: 'null'
          default: null
          title: Width
        height:
          anyOf:
          - maximum: 1600
            minimum: 240
            type: integer
          - type: 'null'
          default: null
          title: Height
        device_scale_factor:
          anyOf:
          - maximum: 2
            minimum: 1
            type: number
          - type: 'null'
          default: null
          title: Device Scale Factor
        input_id:
          anyOf:
          - minimum: 1
            type: integer
          - type: 'null'
          default: null
          title: Input Id
        x:
          anyOf:
          - minimum: 0
            type: number
          - type: 'null'
          default: null
          title: X
        y:
          anyOf:
          - minimum: 0
            type: number
          - type: 'null'
          default: null
          title: Y
        click_count:
          default: 1
          enum:
          - 1
          - 2
          title: Click Count
          type: integer
        delta_x:
          anyOf:
          - maximum: 2048
            minimum: -2048
            type: number
          - type: 'null'
          default: null
          title: Delta X
        delta_y:
          anyOf:
          - maximum: 2048
            minimum: -2048
            type: number
          - type: 'null'
          default: null
          title: Delta Y
        target:
          anyOf:
          - $ref: '#/components/schemas/BrowserControlTarget'
          - type: 'null'
          default: null
        code:
          anyOf:
          - maxLength: 32
            type: string
          - type: 'null'
          default: null
          title: Code
        key:
          anyOf:
          - maxLength: 32
            type: string
          - type: 'null'
          default: null
          title: Key
        phase:
          anyOf:
          - enum:
            - down
            - up
            type: string
          - type: 'null'
          default: null
          title: Phase
        modifiers:
          default: 0
          maximum: 15
          minimum: 0
          title: Modifiers
          type: integer
        repeat:
          default: false
          title: Repeat
          type: boolean
        text:
          anyOf:
          - maxLength: 2048
            minLength: 1
            type: string
          - type: 'null'
          default: null
          title: Text
        source:
          anyOf:
          - enum:
            - typing
            - composition
            - paste
            type: string
          - type: 'null'
          default: null
          title: Source
      required:
      - operation
      - control_epoch
      title: BrowserControlCommand
      type: object

    BrowserControlSessionRequest:
      type: object
      additionalProperties: false
      required: [chat_id, generation, browser_session_id]
      properties:
        chat_id: {type: string, minLength: 1, maxLength: 256}
        generation: {type: string, minLength: 1, maxLength: 128}
        browser_session_id: {type: string, minLength: 1, maxLength: 128}
    BrowserControlSessionResponse:
      type: object
      required: [ticket, expires_in, websocket_path]
      properties:
        ticket: {type: string}
        expires_in: {type: integer}
        websocket_path: {type: string}
    AccountInfo:
      type: object
      required: [account_id, username, role, enabled, resource_owner]
      properties:
        account_id: { type: string }
        username: { type: string }
        role: { type: string, enum: [admin, user] }
        enabled: { type: boolean }
        resource_owner: { type: string }
    AccountCreateRequest:
      type: object
      additionalProperties: false
      required: [username, password]
      properties:
        username: { type: string, minLength: 3, maxLength: 128 }
        password: { type: string, minLength: 1, maxLength: 1024 }
    AccountPasswordResetRequest:
      type: object
      additionalProperties: false
      required: [password]
      properties:
        password: { type: string, minLength: 1, maxLength: 1024 }
    AccountResponse:
      type: object
      required: [status, data]
      properties:
        status: { type: string }
        message: { type: [string, "null"] }
        data: { $ref: "#/components/schemas/AccountInfo" }
    AccountListResponse:
      type: object
      required: [status, data]
      properties:
        status: { type: string }
        message: { type: [string, "null"] }
        data:
          type: array
