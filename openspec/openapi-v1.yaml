        \ without run content."
      operationId: open_chat_browser_api_v1_workflow_chat_runs__run_id__connection_post
      parameters:
      - name: run_id
        in: path
        required: true
        schema:
          type: string
          title: Run Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    get:
      tags:
      - Agent Teams workflows
      summary: Chat Browser Status
      description: "Poll source confirmation using the browser-only secret.\n\nArgs:\n\
        \    run_id: Root run to which this connection is restricted.\n    credential:\
        \ Browser-only session confirmed through the original source.\n    service:\
        \ Shared application service.\n\nReturns:\n    Confirmation state without private\
        \ execution data."
      operationId: chat_browser_status_api_v1_workflow_chat_runs__run_id__connection_get
      security:
      - ChatBrowserSession: []
      parameters:
      - name: run_id
        in: path
        required: true
        schema:
          type: string
          title: Run Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
