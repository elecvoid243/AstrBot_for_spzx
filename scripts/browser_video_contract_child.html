<!doctype html><meta charset="utf-8"><title>Cross-origin coordinate child</title>
<style>body{margin:0}#scroller{height:240px;overflow:auto}button{display:block;width:100%;height:120px;border:0;font:32px system-ui}#a{background:rgb(220,30,30)}#b{background:rgb(30,200,60)}</style>
<div id="scroller"><button id="a">Frame A</button><button id="b">Frame B</button><div style="height:700px"></div></div>
<script>window.hits=[];a.onclick=()=>hits.push('A');b.onclick=()=>hits.push('B');window.scrollChild=()=>scroller.scrollTop=120;</script>
