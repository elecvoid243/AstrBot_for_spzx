        default_provider_id:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          title: Default Provider Id
        coordinator:
          $ref: '#/components/schemas/TeamRole'
        allowed_roles:
          items:
            $ref: '#/components/schemas/TeamRole'
