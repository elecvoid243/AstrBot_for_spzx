        kind:
          enum:
          - profiles
          - models
          - personas
          - tools
          - skills
          - knowledge_bases
          title: Kind
          type: string
        source_id:
          maxLength: 128
          minLength: 1
          title: Source Id
          type: string
        target_id:
          maxLength: 128
          minLength: 1
          title: Target Id
          type: string
      required:
      - kind
      - source_id
      - target_id
      title: ResourceSelection
      type: object
