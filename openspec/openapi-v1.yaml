      description: >-
        Ordinary accounts and administrators may access only their own WebChat
        sessions. History, markers and associated resources retain that ownership.
      x-astrbot-scope: chat
      parameters:
        - $ref: "#/components/parameters/SessionId"
      responses:
        "200":
          description: User questions with bounded reply previews.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/ChatMessageMarkers"

  /api/v1/chat/sessions/{session_id}/goal:
    get:
      tags: [Chat]
      summary: Return the standing-goal state for a session (null when none)
      operationId: getChatSessionGoal
      description: Requires current account ownership of the persisted WebChat session. Run and subagent identifiers do not grant access to another account.
      x-astrbot-scope: chat
      parameters:
        - $ref: "#/components/parameters/SessionId"
      responses:
        "200":
          $ref: "#/components/responses/Ok"
    post:
      tags: [Chat]
      summary: Set (or replace) the session's standing goal and kick off the loop
      operationId: setChatSessionGoal
      description: Requires current account ownership of the persisted WebChat session. Run and subagent identifiers do not grant access to another account.
      x-astrbot-scope: chat
      parameters:
        - $ref: "#/components/parameters/SessionId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [goal]
              properties:
                goal:
                  type: string
                  description: The goal description; becomes the loop's first turn.
                max_turns:
                  type: integer
                  description: Optional turn-budget override; omitted follows the goal.max_turns config.
      responses:
        "200":
          $ref: "#/components/responses/Ok"

