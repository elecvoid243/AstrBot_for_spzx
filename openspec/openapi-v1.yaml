        request_id:
          type: string
          maxLength: 128
          minLength: 1
          title: Request Id
        action:
          type: string
          enum:
          - retry
          - confirm_result
          - confirm_failure
          - reconcile
          title: Action
        evidence:
          type: string
          maxLength: 100000
          minLength: 1
          title: Evidence
        result:
          anyOf:
          - type: string
            maxLength: 1000000
            minLength: 1
          - type: 'null'
          title: Result
      additionalProperties: false
      type: object
      required:
      - request_id
      - action
      - evidence
      title: ToolResolutionRequest
      description: An explicit, evidenced decision about an uncertain external effect.
    WorkflowControlRequest:
      properties:
        request_id:
          type: string
          maxLength: 128
          minLength: 1
          title: Request Id
        action:
          type: string
          enum:
          - pause
          - continue
          - cancel
          title: Action
        expected_revision:
          anyOf:
          - type: integer
            minimum: 0.0
          - type: 'null'
          title: Expected Revision
      additionalProperties: false
      type: object
      required:
      - request_id
      - action
      title: WorkflowControlRequest
      description: Idempotent whole-run decision, optionally conditional on its revision.
    WorkflowRetryRequest:
      properties:
        request_id:
          type: string
          maxLength: 128
          minLength: 1
          title: Request Id
        attempt_id:
          type: string
          maxLength: 128
          minLength: 1
          title: Attempt Id
        input_policy:
          type: string
          const: original
          title: Input Policy
      additionalProperties: false
      type: object
      required:
      - request_id
      - attempt_id
      - input_policy
      title: WorkflowRetryRequest
      description: Explicit new attempt using the failed attempt's exact frozen inputs.
    ChatAccessRequest:
      properties:
        platform_id:
          type: string
          maxLength: 128
          minLength: 1
          title: Platform Id
        sender_id:
          type: string
          maxLength: 256
          minLength: 1
          title: Sender Id
        version:
          type: integer
          minimum: 1.0
          title: Version
        profile_id:
          type: string
          maxLength: 128
          minLength: 1
          title: Profile Id
        source:
          type: string
          maxLength: 512
          minLength: 1
          title: Source
      additionalProperties: false
      type: object
      required:
      - platform_id
      - sender_id
      - version
      - profile_id
      - source
      title: ChatAccessRequest
      description: A deliberate local grant; importing an asset never grants access.
    TrialSource:
      type: object
      additionalProperties: false
      properties:
        content:
          anyOf:
          - type: object
            additionalProperties: true
          - type: 'null'
        artifact:
          anyOf:
          - $ref: '#/components/schemas/ArtifactReference'
          - type: 'null'
    TrialRunRequest:
      type: object
      additionalProperties: false
      required: [kind, revision, mode]
      properties:
        kind: {type: string, enum: [workflow, autonomous]}
        revision: {type: integer, minimum: 1}
        mode: {type: string, enum: [full, single, partial]}
        node_id:
          anyOf:
          - type: string
          - type: 'null'
        inputs:
          type: object
          additionalProperties: {type: string}
        sources:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/TrialSource'
    WorkflowStartRequest:
      properties:
        version:
          type: integer
          minimum: 1.0
          title: Version
        inputs:
          additionalProperties:
            type: string
          type: object
          title: Inputs
        source:
          type: string
          maxLength: 512
          minLength: 1
          title: Source
          default: dashboard
        input_artifacts:
          items:
            $ref: '#/components/schemas/ArtifactReference'
          type: array
          maxItems: 30
          title: Input Artifacts
          description: Fixed full-artifact inputs for autonomous teams. Workflow graphs use explicitly selected node inputs.
      additionalProperties: false
      type: object
      required:
      - version
      title: WorkflowStartRequest
      description: Start a pinned version with explicit inputs and source identity.
    ArtifactReference:
      properties:
        artifact_id:
          type: string
          maxLength: 128
          minLength: 1
          title: Artifact Id
        version:
          type: integer
          minimum: 1.0
          title: Version
      additionalProperties: false
      type: object
      required:
      - artifact_id
      - version
      title: ArtifactReference
      description: An exact immutable artifact version; latest is never inferred.
    ArtifactRevisionRequest:
      properties:
        expected_version:
          type: integer
          minimum: 1.0
          title: Expected Version
        request_id:
          type: string
          maxLength: 128
          minLength: 1
          title: Request Id
        content:
          additionalProperties: true
          type: object
          title: Content
      additionalProperties: false
      type: object
      required:
      - expected_version
      - request_id
      - content
      title: ArtifactRevisionRequest
      description: Explicit, idempotent revision without downstream scheduling effects.
    HumanTask:
      properties:
        human_wait:
          $ref: '#/components/schemas/HumanWaitPolicy'
        kind:
          type: string
          enum:
          - question
          - approval
          title: Kind
        question:
          type: string
          maxLength: 100000
          minLength: 1
          title: Question
        choices:
          items:
            type: string
          type: array
          maxItems: 100
          title: Choices
        max_length:
          type: integer
          maximum: 100000.0
          minimum: 1.0
          title: Max Length
          default: 10000
        artifact_task_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Artifact Task Id
        artifact_version:
          type: integer
          minimum: 1.0
          title: Artifact Version
          default: 1
        recommendation_task_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Recommendation Task Id
        recommendation_value_field:
          anyOf:
          - type: string
          - type: 'null'
          title: Recommendation Value Field
        recommendation_reason_field:
          anyOf:
          - type: string
          - type: 'null'
          title: Recommendation Reason Field
      additionalProperties: false
      type: object
      required:
      - kind
      - question
      title: HumanTask
      description: A frozen question or approval of one upstream artifact version.
    HumanAnswerRequest:
      properties:
        request_id:
          type: string
          maxLength: 128
          minLength: 1
          title: Request Id
        action:
          type: string
          enum:
          - answer
          - approve
          - reject
          title: Action
        answer:
          anyOf:
          - type: string
            maxLength: 100000
            minLength: 1
          - type: 'null'
          title: Answer
        feedback:
          anyOf:
          - type: string
            maxLength: 100000
            minLength: 1
          - type: 'null'
          title: Feedback
        choice_id:
          anyOf:
          - type: string
            minLength: 1
            maxLength: 128
          - type: 'null'
          title: Choice Id
        free_text:
          anyOf:
          - type: string
            minLength: 1
            maxLength: 10000
          - type: 'null'
          title: Free Text
        artifact_ref:
          anyOf:
          - $ref: '#/components/schemas/ArtifactReference'
          - type: 'null'
      additionalProperties: false
      type: object
      required:
      - request_id
      - action
      title: HumanAnswerRequest
      description: Idempotent answer or explicit version decision with rejection feedback.
    GraphLoop:
      additionalProperties: false
      description: A disjoint, finite task group with a typed exit and explicit feedback.
      properties:
        id:
          maxLength: 128
          minLength: 1
          pattern: ^[a-zA-Z][\w-]*$
          title: Id
          type: string
        name:
          maxLength: 128
          minLength: 1
          title: Name
          type: string
        body:
          items:
            type: string
          maxItems: 100
          minItems: 1
          title: Body
          type: array
        exit_task_id:
          title: Exit Task Id
          type: string
        exit_condition:
          $ref: '#/components/schemas/FieldCondition'
        max_iterations:
          maximum: 100
          minimum: 1
          title: Max Iterations
          type: integer
        feedback:
          items:
            $ref: '#/components/schemas/LoopFeedback'
          maxItems: 100
          title: Feedback
          type: array
      required:
      - id
      - name
      - body
      - exit_task_id
      - exit_condition
      - max_iterations
      title: GraphLoop
      type: object
    LoopFeedback:
      additionalProperties: false
      description: Explicit next-round input from a completed previous-round result.
      properties:
        target:
          title: Target
          type: string
        input:
          title: Input
          type: string
        source:
          title: Source
          type: string
        field:
          default: text
          title: Field
          type: string
      required:
      - target
      - input
      - source
      title: LoopFeedback
      type: object
    TeamRole:
      additionalProperties: false
      description: A stable preset with an inline or pinned role source.
      properties:
        id:
          maxLength: 128
          minLength: 1
          title: Id
          type: string
        role_id:
          anyOf:
          - maxLength: 128
            minLength: 1
            type: string
          - type: 'null'
          default: null
